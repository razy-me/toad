name: Sync to Public Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          path: private_repo

      - name: Checkout Public Repo
        uses: actions/checkout@v4
        with:
          repository: razy-me/toad
          ssh-key: ${{ secrets.SYNC_PUBLIC_KEY }}
          path: public_repo
          fetch-depth: 1

      - name: Sync and Mirror Clean Files
        run: |
          cd public_repo

          # Configure Git
          git config user.name "razy-me"
          git config user.email "florian8schuster@gmail.com"

          # Remove all existing tracked files in public repo (except .git)
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          # Copy everything from private_repo except excluded private directories/files
          rsync -av \
            --exclude='.git' \
            --exclude='.agents' \
            --exclude='_agents' \
            --exclude='the_seed' \
            --exclude='soul-poster' \
            --exclude='assets/logo' \
            --exclude='GEMINI.md' \
            --exclude='PROJECT.md' \
            --exclude='.github' \
            --exclude='scripts/sync-public.ps1' \
            ../private_repo/ ./

          # Check git status and commit if changes exist
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit. Public repository is already up to date."
          else
            git commit -m "sync: release from toad-private $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
          fi
