      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="rgba(16, 185, 129, 0.25)" />
    </filter>
    <linearGradient id="lin_grad_1" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="filter_2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ccff00" />
    </filter>
    <filter id="filter_3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ccff00" />
    </filter>
    <filter id="filter_4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="rgba(16, 185, 129, 0.35)" />
    </filter>
    <filter id="filter_5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="17.5" flood-color="rgba(0, 0, 0, 0.5)" />
    </filter>
