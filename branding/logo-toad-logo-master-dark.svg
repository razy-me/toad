    <text x="580" y="297.5" font-family="sans-serif" font-size="52" font-weight="900" font-style="normal" text-anchor="start" fill="#07090e" id="appPrompt" dominant-baseline="hanging">&gt;_</text>
 <rect x="535" y="371" width="130" height="14" rx="7" ry="7" fill="#07090e" id="appMouth" />
