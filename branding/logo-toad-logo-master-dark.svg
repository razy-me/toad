 <rect x="392" y="92" width="416" height="416" rx="84" ry="84" fill="transparent" stroke="rgba(16, 185, 129, 0.5)" stroke-width="2" id="appRim" />
 <rect x="460" y="246" width="280" height="180" rx="56" ry="56" fill="url(#lin_grad_2)" id="appToadHead" filter="url(#filter_5)" />
 <circle cx="526" cy="248" r="50" fill="#0c1220" stroke="#10b981" stroke-width="7" id="appEyeLeftOuter" />
 <circle cx="526" cy="248" r="24" fill="#ccff00" id="appEyeLeftCore" filter="url(#filter_6)" />
 <circle cx="674" cy="248" r="50" fill="#0c1220" stroke="#10b981" stroke-width="7" id="appEyeRightOuter" />
