        <rect x="628.5" y="210" width="175" height="22" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
        <text x="640.5" y="214" font-family="sans-serif" font-size="11" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="2" fill="#10b981" id="badgeText" dominant-baseline="hanging">SPATIAL DESIGN DSL • v2.4</text>
      </g>
      <g id="wordmarkRow">
        <text x="628.5" y="244" font-family="sans-serif" font-size="78" font-weight="900" font-style="normal" text-anchor="start" letter-spacing="-2" fill="#ffffff" id="brandName" dominant-baseline="hanging">toad</text>
        <text x="742.5" y="244" font-family="sans-serif" font-size="32" font-weight="800" font-style="normal" text-anchor="start" fill="#10b981" id="extensionTag" dominant-baseline="hanging">.dsl</text>
      </g>
      <text x="628.5" y="354" font-family="sans-serif" font-size="14" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="5" fill="#94a3b8" id="brandClaim" dominant-baseline="hanging">CODE YOUR CANVAS.</text>
