 <rect x="392.5" y="210" width="180" height="180" rx="40" ry="40" fill="#0d1322" stroke="#1e293b" stroke-width="2" id="emblemBase" filter="url(#filter_1)" />
 <rect x="398.5" y="216" width="168" height="168" rx="34" ry="34" fill="transparent" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" id="emblemRim" />
