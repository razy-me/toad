<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <filter id="filter_1" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00000040" />
    </filter>
    <filter id="filter_2" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00000040" />
    </filter>
    <filter id="filter_3" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00000040" />
    </filter>
    <filter id="filter_4" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3b82f640" />
    </filter>
    <linearGradient id="lin_grad_1" x1="15%" y1="15%" x2="85%" y2="85%" color-interpolation="sRGB">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a" />
  <text x="80" y="89" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="800" font-style="normal" text-anchor="start" xml:space="preserve" fill="#f8fafc" id="kitTitle">Design System UI Components</text>
  <text x="80" y="130" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="400" font-style="normal" text-anchor="start" xml:space="preserve" fill="#94a3b8" id="kitSubtitle">Production-ready, reusable atomic UI elements built with the TOAD DSL.</text>
  <g id="cardsRow">
    <g id="card1">
 <rect x="80" y="185" width="320" height="180" rx="16" ry="16" fill="#1e293b" stroke="#47556940" stroke-width="1" filter="url(#filter_1)" />
      <text x="104" y="220" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="500" font-style="normal" text-anchor="start" xml:space="preserve" fill="#94a3b8">Monthly Recurring Revenue</text>
      <text x="104" y="275" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="800" font-style="normal" text-anchor="start" xml:space="preserve" fill="#f8fafc">$148,290</text>
      <g >
 <rect x="104" y="309" width="110" height="32" rx="9999" ry="9999" fill="#10b98125" />
        <text x="141.5" y="329.5" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0.5" xml:space="preserve" fill="#34d399">+24.8%</text>
      </g>
    </g>
    <g id="card2">
 <rect x="424" y="185" width="320" height="180" rx="16" ry="16" fill="#1e293b" stroke="#47556940" stroke-width="1" filter="url(#filter_2)" />
      <text x="448" y="220" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="500" font-style="normal" text-anchor="start" xml:space="preserve" fill="#94a3b8">Global Active Sessions</text>
      <text x="448" y="274" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="800" font-style="normal" text-anchor="start" xml:space="preserve" fill="#f8fafc">892,104</text>
      <g >
 <rect x="448" y="309" width="110" height="32" rx="9999" ry="9999" fill="#10b98125" />
        <text x="488" y="329.5" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0.5" xml:space="preserve" fill="#34d399">+12.1%</text>
      </g>
    </g>
    <g id="card3">
 <rect x="768" y="185" width="320" height="180" rx="16" ry="16" fill="#1e293b" stroke="#47556940" stroke-width="1" filter="url(#filter_3)" />
      <text x="792" y="220" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="500" font-style="normal" text-anchor="start" xml:space="preserve" fill="#94a3b8">Conversion Velocity</text>
      <text x="792" y="274" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="800" font-style="normal" text-anchor="start" xml:space="preserve" fill="#f8fafc">4.82%</text>
      <g >
 <rect x="792" y="309" width="110" height="32" rx="9999" ry="9999" fill="#10b98125" />
        <text x="832.5" y="329.5" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0.5" xml:space="preserve" fill="#34d399">+3.6%</text>
      </g>
    </g>
  </g>
  <g id="buttonsSection">
    <text x="80" y="429" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700" font-style="normal" text-anchor="start" xml:space="preserve" fill="#f8fafc" id="btnSectionTitle">Interactive Action Controls</text>
    <g id="btnPrimary">
 <rect x="80" y="458" width="180" height="48" rx="12" ry="12" fill="url(#lin_grad_1)" filter="url(#filter_4)" />
      <text x="131.5" y="486.5" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="start" xml:space="preserve" fill="#ffffff">Deploy Pipeline</text>
    </g>
    <g id="btnSecondary">
 <rect x="276" y="458" width="160" height="48" rx="12" ry="12" fill="none" stroke="#64748b" stroke-width="1" />
      <text x="317.5" y="488" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="start" xml:space="preserve" fill="#f8fafc">Documentation</text>
    </g>
    <g id="badgeLive">
 <rect x="460" y="458" width="110" height="32" rx="9999" ry="9999" fill="#10b981" />
      <text x="480" y="478.5" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0.5" xml:space="preserve" fill="#ffffff">SYSTEM ONLINE</text>
    </g>
    <g id="badgeBeta">
 <rect x="582" y="458" width="110" height="32" rx="9999" ry="9999" fill="#8b5cf6" />
      <text x="606.5" y="478.5" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0.5" xml:space="preserve" fill="#ffffff">v2.4 RELEASE</text>
    </g>
  </g>
</svg>