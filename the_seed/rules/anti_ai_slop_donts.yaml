# Scope: UNIVERSAL APPLICABILITY across ALL TOAD designs (posters, banners, cards, logos, UIs, print).
# Rule: NO exemptions. Less is more applies everywhere.

universal_mandates:
  scope: "APPLIES TO EVERY .toad OUTPUT REGARDLESS OF ARTIFACT TYPE (print, web, poster, logo, banner, card, book cover)."
  core_rule: "WENIGER IST MEHR (Less is more). Eliminate cognitive clutter, reject purposeless decorations, preserve 40-60% negative space."

slop_signatures_and_donts:

  web_and_ui:
    - id: "SLOP-WEB-001"
      name: "Purple Haze Darkmode Syndrome"
      tell: "Pure black canvas (#000000) with 2-3 random blurred violet/cyan circles floating behind headlines."
      dont: "DO NOT emit arbitrary radial glow circles (#8B5CF6 / #06B6D4) without physical light source."
      do: "Use architectural surface stepping (#0F172A -> #1E293B) or clean gridline strokes (alpha(#fff, 0.06))."

    - id: "SLOP-WEB-002"
      name: "Meaningless Bento-Grid Overkill"
      tell: "Forcing simple paragraphs, quotes, or 2-step lists into a 6-box glassmorphism grid."
      dont: "DO NOT box everything into identical rounded cards with alpha(#fff, 0.1) borders."
      do: "Use asymmetrical layouts, editorial type contrast, and reserve bento for multi-metric dashboards."

    - id: "SLOP-WEB-003"
      name: "Supercharge Phrasen-Dreschmaschine"
      tell: "Headlines like 'Supercharge your workflow with next-gen synergy' with zero actual facts."
      dont: "NEVER use the buzzword triad: 'Supercharge', 'Seamless', 'Next-Gen'."
      do: "Write specific, grounded domain copy with numbers, tools (e.g. DATEV, Slack, SQL), and exact outcomes."

    - id: "SLOP-WEB-004"
      name: "Senseless Floating Glass Torus"
      tell: "Floating chrome donuts, shiny spheres, or pearlescent ribbon blobs hovering in hero corners."
      dont: "DO NOT place decorative 3D geometric debris to fill empty hero space."
      do: "Render authentic product artifacts: code viewports, data flows, receipts, invoices, or UI mockups."

    - id: "SLOP-WEB-005"
      name: "Rainbow Pill-Button Overload"
      tell: "Buttons with hot-pink to cyan gradients, glowing borders, inner glow, and arrow icons on all links."
      dont: "DO NOT give every button on a page glowing neon gradients."
      do: "Use 1-color high-contrast primary actions (e.g. dark aubergine or pure cream) and understated ghost secondary links."

    - id: "SLOP-WEB-007"
      name: "Glassmorphism Overdose & Extreme Corner Radii"
      tell: "Every card, box, and navbar turned into a frosted translucent glass slab (blur + 1px white border) with childish 24-36px soap-bar rounded corners."
      dont: "NEVER use ubiquitous frosted glassmorphism across all content cards or giant 32px radii on standard text containers."
      do: "Use solid, opaque surfaces with architectural value hierarchy (#0F172A -> #1E293B) and disciplined 6-12px radii (or sharp 0-2px for editorial/fintech)."

    - id: "SLOP-WEB-008"
      name: "Horror Vacui & Compulsive Clutter Overload (Less is More)"
      tell: "Overstuffing the canvas with 15 redundant badges, decorative pills, sub-cards, borders, and micro-icons."
      dont: "DO NOT fill every free pixel just because empty space exists. Avoid cognitive clutter and shouting elements."
      do: "WENIGER IST MEHR (Less is More): Reserve 40-60% of canvas as generous negative space. Delete 25% of elements during review."

    - id: "SLOP-WEB-009"
      name: "Purposeless Left Border Stripe"
      tell: "3-4px accent stripe exclusively on left card edge without semantic status function."
      dont: "DO NOT apply arbitrary colored left-edge stripes to neutral content cards."
      do: "Reserve border colors strictly for verified system states (success/error/warning)."

    - id: "SLOP-WEB-010"
      name: "Editorial Faker Italic Serif Break"
      tell: "Single italic serif word stuck into an otherwise pure sans-serif headline for pseudo-elegance."
      dont: "NEVER switch font families mid-sentence just to fake luxury editorial flair."
      do: "Build honest typographic hierarchy: use consistent display serif or pure grotesque throughout."

    - id: "SLOP-WEB-011"
      name: "Snapping Hover States & Dead Anchors"
      tell: "Buttons snap instantly without CSS transitions; navigation links point to dead href='#'."
      dont: "DO NOT emit rigid snapping states without easing transitions or dead placeholder links."
      do: "Include smooth transitions (150-200ms cubic-bezier) and functional interaction states."

    - id: "SLOP-WEB-012"
      name: "Monotone Triplet Feature Clones & Rigid 6-Stage Template"
      tell: "Always exactly 3 identical cards with centered icons, following a rigid 6-part landing page recipe."
      dont: "DO NOT force all feature presentations into identical 3-column icon boxes."
      do: "Vary layout rhythms with asymmetric feature blocks, real UI previews, and modular storytelling."

    - id: "SLOP-WEB-013"
      name: "shadcn-Monochrom-Paralyse"
      tell: "Pure unadjusted zinc-900 / neutral-900 palettes (#09090B canvas, #27272A borders, #FAFAFA text) with zero brand personality or color temperature."
      dont: "DO NOT leave shadcn default dark-mode tokens untouched as a generic substitute for visual brand identity."
      do: "Inject authentic brand hue and temperature: warm off-blacks (#121110, #181614) or deep cool slate (#0B1120, #0F172A) with distinct chromatic accents."

    - id: "SLOP-WEB-014"
      name: "Ornamentales Live-Pulse Eyebrow-Badge"
      tell: "Pill badge with a glowing green pinging dot above the headline pretending to show real-time system status ('v2.0 Just Released', 'System Operational')."
      dont: "DO NOT attach decorative pseudo-live pulse dots to static marketing headlines."
      do: "Use clean semantic kicker typography or reserve live indicator beacons strictly for actual real-time telemetry panels."

    - id: "SLOP-WEB-015"
      name: "Russian-Doll Container Nesting"
      tell: "Deeply nested cards inside cards inside bento sections with 3-4 concentric 1px borders, creating massive dead space."
      dont: "DO NOT wrap content in multiple redundant nested containers with borders."
      do: "Flatten container hierarchies: rely on generous padding, typographic groupings, and subtle surface steps instead of boxing boxes."

    - id: "SLOP-WEB-016"
      name: "Endlos-Marquee erfundener Partner-Logos"
      tell: "Infinitely auto-scrolling horizontal band of 6 muted gray fake logos ('Sphere', 'Apex', 'Vortex', 'Polymer') creating an illusion of social proof."
      dont: "DO NOT populate hero sections with animated marquees of generic invented company logos."
      do: "Feature genuine verified customer logos, real technical certifications, or confident whitespace without filler marquees."

    - id: "SLOP-GEOM-001"
      name: "Konzentrischer Radien-Bruch (Soap inside Soap)"
      tell: "Nested rounded elements where inner child radius equals or exceeds outer card radius (R_child >= R_parent), pinching corners visually."
    - id: "SLOP-WEB-017"
      name: "Fake Social Proof Avatar Pile (The 5-Face Stack)"
      tell: "Cluster of 4-5 overlapping avatar circles with white borders followed by 'Loved by 10k+ founders' with zero actual customer citations."
      dont: "DO NOT stack fake avatar circles and generic 5-star ratings without real customer names and case studies."
      do: "Show verified customer quotes with full name, real title, and concrete metric ROI, or leave confident negative space."

    - id: "SLOP-WEB-018"
      name: "Stereotypical 5-Stage Hero Formula Pipeline"
      tell: "Rigid sequential template: Pill Eyebrow -> Display H1 with gradient -> Centered 3-line subline -> 2 Buttons -> Tilt Mockup."
      dont: "DO NOT force every hero section into the exact same 5-stage centered template."
      do: "Vary layout rhythm with asymmetric leads, split-screen product previews, or disciplined editorial typographic composition."

    - id: "SLOP-WEB-019"
      name: "Void Glow Halo Backlight"
      tell: "Massive 50px+ blurred glow floating behind an isolated card without physical lighting fixture or surface context."
      dont: "DO NOT emit arbitrary radial glow fields behind cards without physical light source."
      do: "Ground cards with architectural surface stepping (#0F172A -> #1E293B) and crisp 1px borders."

    - id: "SLOP-WEB-020"
      name: "Infinite Testimonial Grid Hallucination"
      tell: "Grid of 6+ cards filled with repetitive generic hype quotes ('Total game changer!', 'Supercharge your team!')."
      dont: "DO NOT populate testimonial sections with generic AI-generated praise quotes."
      do: "Feature 2-3 verified case studies with real customer metrics, company logos, and domain outcomes."

    - id: "SLOP-UI-001"
      name: "Contradictory Virtual Lighting Vectors (Specular Chaos)"
      tell: "Card A casts shadow downwards (90°), Card B casts shadow upwards (-90°), and button has highlight at 45°."
      dont: "DO NOT mix disparate virtual light angles across components in the same interface."
      do: "Establish a single global virtual light origin (e.g. 270° from top or 315° from top-left) across the design system."

    - id: "SLOP-UI-002"
      name: "Luminous / Inverted Shadows"
      tell: "Drop shadow with higher luminance than the canvas background, glowing instead of subtracting light."
      dont: "NEVER use shadows that are brighter than the surface they are cast upon."
      do: "Shadows must subtract luminance: derive shadow colors from darkened background shades or black alpha."

    - id: "SLOP-UI-003"
      name: "Uncanny Glassmorphism Contrast Collapse"
      tell: "Translucent glass card (alpha < 0.35) over varied background causing text contrast to collapse below 2.5:1."
      dont: "DO NOT put text on transparent glassmorphism without a guaranteed contrast floor."
      do: "Back glassmorphic containers with an opaque fallback layer (min 85% opacity) for WCAG AA compliance."

    - id: "SLOP-UI-004"
      name: "Safe-Area Blindness & Mobile Bottom Collision"
      tell: "Mobile layout where bottom-docked navigation touches screen bottom without safe-area inset."
      dont: "DO NOT stick actions directly to bottom: 0px on mobile screens."
      do: "Enforce bottom padding: minimum 24px (env(safe-area-inset-bottom)) for iOS Home Indicator clearance."

    - id: "SLOP-UI-005"
      name: "Destructive Action Ambiguity (The Symmetrical Modal)"
      tell: "Modal dialog where destructive action (Delete) and Cancel have identical visual styling and button variant."
      dont: "NEVER give destructive and neutral dismissive actions identical visual weight."
      do: "Style Cancel as understated secondary ghost button; highlight destructive action in distinct danger color."

    - id: "SLOP-UI-006"
      name: "Dead Status Pill Overkill (Status Theater)"
      tell: "Table with 8+ rows where every single row displays an identical green 'Operational' status badge."
      dont: "DO NOT clutter table rows with redundant zero-variance status pills."
      do: "Practice exception-based reporting: 1 global health indicator in header; reserve row badges for anomalies."

    - id: "SLOP-MOB-001"
      name: "Desktop-in-a-Box Viewport Scaling (The CSS Zoom Trap)"
      tell: "Mobile screen scaling down a complex desktop container with scale < 0.7 instead of reflowing."
      dont: "DO NOT shrink desktop layouts into mobile viewports using CSS zoom or scale."
      do: "Implement genuine responsive reflow: 1-column vertical stacks with min 16px body type."

    - id: "SLOP-MOB-002"
      name: "One-Thumb Hostility"
      tell: "Primary call-to-action placed in the upper-left corner on mobile screens, unreachable by one hand."
      dont: "DO NOT place primary mobile actions in the top thumb dead-zone."
      do: "Place primary mobile actions in the bottom thumb comfort zone (e.g. sticky bottom bar)."


  logos_and_branding:
    - id: "SLOP-LOGO-001"
      name: "Gradient Infinity Loop / Origami Ribbon"
      tell: "Overlapping folded ribbons with continuous 5-color gradients that vanish in monochrome."
      dont: "DO NOT design logos that depend on gradients to define their shape or silhouette."
      do: "Pass the Fax & Embroidery Test: Logo must be 100% legible as flat 1-bit black on white."

    - id: "SLOP-LOGO-002"
      name: "Circuit Hexagon Cube"
      tell: "Isometric 3D hexagon cube with glowing PCB traces and solder nodes."
      dont: "NEVER use the isometric circuit hexagon for tech, crypto, or AI brands."
      do: "Craft bespoke typographic wordmarks with unique ligatures or unexpected architectural metaphors."

    - id: "SLOP-LOGO-003"
      name: "Sprouting Leaf in Gear / Green Hands"
      tell: "Literal leaf growing out of cogwheel for sustainability/greentech."
      dont: "DO NOT combine two literal clipart icons into a hybrid cliché."
      do: "Adopt abstract topological forms, brutalist typography, or nature-inspired geometric ratios."

    - id: "SLOP-LOGO-004"
      name: "Favicon Micro-Detail Smear"
      tell: "Signets with 12 razor-thin vector lines that become muddy gray noise at 32x32px."
      dont: "DO NOT use stroke weights < 2px or gaps < 4px inside brandmarks."
      do: "Design bold, high-contrast silhouette geometry that retains recognizability at 16x16px."

    - id: "SLOP-LOGO-005"
      name: "Dense Node Clustering & Wobbly Curves"
      tell: "40-200+ chaotic anchor points per curve; C¹/C² continuity violations creating wobbly sawtooth edges."
      dont: "NEVER output raw auto-traced vectors with dense node clusters and jittery edges."
      do: "Enforce strict node economy: 2 to 4 anchor points per base curve with harmonized tangential handles."

    - id: "SLOP-LOGO-006"
      name: "Boolean Deficits & Vector Islands"
      tell: "Overlapping open loops, self-intersecting paths, and floating 1px noise specks from auto-tracing."
      dont: "DO NOT leave unmerged shapes, open paths, or orphan noise specks in vector logos."
      do: "Execute clean Pathfinder Boolean unions/subtractions and delete all disconnected micro-islands."

    - id: "SLOP-LOGO-007"
      name: "Terraced Banding Zones & Plotter Collapse"
      tell: "Gradients autotraced into dozens of stacked micro-paths, failing completely in plotter/CNC/embroidery."
      dont: "DO NOT substitute true gradients with stacked stepped path layers that jam production machinery."
      do: "Use pure mathematical gradients or solid fills with verified closed cuttable outer contours."

  graphics_and_illustration:
    - id: "SLOP-GFX-001"
      name: "Corporate Memphis Noodle Arms"
      tell: "Flat figures with giant blue/purple pants, long jointless noodle arms, and tiny faceless heads."
      dont: "NEVER emit Corporate Memphis / Alegria flat tech figures."
      do: "Use technical engineering diagrams, woodcut/linocut textures, riso-print styling, or pure data typography."

    - id: "SLOP-GFX-002"
      name: "Floating Geometric Confetti"
      tell: "Random floating plus signs (+), empty circles, zigzag squiggles, and confetti dots around artwork."
      dont: "DO NOT scatter purposeless vector confetti to disguise visual emptiness."
      do: "Embrace confident negative space (whitespace) or use functional drafting marks (rulers, crosshairs)."

    - id: "SLOP-GFX-003"
      name: "Muddy Linear RGB Gradient Bleed"
      tell: "Complementary gradients (e.g. blue to orange) turning into dirty sewage gray in the middle."
      dont: "DO NOT interpolate opposite color wheel hues without an intermediary saturation stop."
      do: "Add a vivid intermediate color stop (e.g. blue -> violet -> warm red -> orange) or use analog palettes."

    - id: "SLOP-GFX-004"
      name: "Melting Outlines & Open Body Shapes"
      tell: "Line art dissolves midway into background shading or textures; outlines fail to form closed hulls."
      dont: "DO NOT output vector illustrations with unclosed silhouettes or bleeding contour strokes."
      do: "Maintain strict contour enclosure separating foreground figures, specular highlights, and backdrop."

    - id: "SLOP-GFX-005"
      name: "Depth-Collapsing Visual Tangents"
      tell: "Foreground contours align exactly with horizon lines or background architectural edges, flattening 3D space."
      dont: "NEVER allow edges from different spatial depths to graze or share a 2D line."
      do: "Enforce decisive geometric overlap or generous separation between spatial planes."

    - id: "SLOP-GFX-006"
      name: "Polycentric Vanishing Points"
      tell: "Architecture and patterns with conflicting perspective axes and staircases ending abruptly at walls."
      dont: "DO NOT mix disparate perspective horizons within the same architectural scene."
      do: "Construct rigorous 1-point, 2-point, or axonometric isometric perspective projection grids."

    - id: "SLOP-GFX-007"
      name: "Senseless Non-Functional Greebling"
      tell: "Dense mechanical greebles (hoses ending in blank metal, gears with mismatched teeth, blocked joints)."
      dont: "DO NOT clutter mechanical surfaces with purposeless pseudo-engineering debris."
      do: "Design with functional mechanical plausibility: ensure pivot clearances, cable paths, and resting surfaces."

    - id: "SLOP-GFX-008"
      name: "Atmospheric Distance Collapse"
      tell: "Distant mountains or skylines rendered with razor-sharp edges and 100% foreground contrast/saturation."
      dont: "DO NOT render backgrounds with identical sharpness and chromatic saturation as foreground heroes."
      do: "Honor atmospheric physics: diminish contrast, soften edges, and introduce cool tinting at distance."

    - id: "SLOP-GFX-009"
      name: "Impossible Isometric Spatial Intersection (Escher Glitch)"
      tell: "2.5D axonometric graphics where lower depth elements incorrectly overlap foreground objects."
      dont: "DO NOT allow z-index conflicts to violate physical perspective projection."
      do: "Sort isometric geometry strictly by spatial depth: Depth = (x + y) / sqrt(2) + z."

    - id: "SLOP-GFX-010"
      name: "Faux-Brutalist Decorative Barcode & QR Abuse"
      tell: "Barcodes or QR codes with rounded corners, missing quiet zones, or invalid checksums used as decals."
      dont: "NEVER emit rounded, unscannable barcodes as decorative stickers."
      do: "Ensure 0px border radius, sharp vector edges, and ISO-compliant quiet zones on true functional codes."

    - id: "SLOP-GFX-011"
      name: "Telemetry Noise & Pseudocode Greebling"
      tell: "Rando monospace strings ('SYS_BOOT // 0x8849F') stamped onto layout edges to fake technical authority."
      dont: "DO NOT use fake telemetry strings as visual filler."
      do: "Display authentic colophon metadata, Git commit hashes, or confident negative space."

    - id: "SLOP-GFX-012"
      name: "Shader-Toy Iridescent Oil-Slick Blob"
      tell: "Amorphous fluid path in background filled with 4+ discordant rainbow hues without product context."
      dont: "DO NOT scatter decorative multi-color fluid meshes behind business headlines."
      do: "Use disciplined architectural stepping or concrete product engineering schematics."

    - id: "SLOP-COLOR-003"
      name: "Linear sRGB Dead-Zone Mud Gradient"
      tell: "2-stop gradient between complementary hues (deltaHue >= 100°) yielding dirty desaturated gray in center."
      dont: "DO NOT interpolate opposite color wheel hues in linear sRGB without intermediate saturation bridge."
      do: "Interpolate in OKLCH (linear-gradient(in oklch, ...)) or insert a vibrant bridge stop."

  photography_and_scenic:
    - id: "SLOP-PHOTO-001"
      name: "Porcelain Wax Museum Skin & Ringlight Eyes"
      tell: "Poreless plastic skin, perfect radial ringlight reflections in both eyes, artificial dental veneer grins."
      dont: "DO NOT render smooth plastic human faces or perfectly centered ringlight catchlights."
      do: "Demand realistic skin pores, natural facial asymmetry, 400 ISO film grain, and directional window light."

    - id: "SLOP-PHOTO-002"
      name: "Toxic Orange-Teal God-Rays Overdrive"
      tell: "Blinding volumetric sunbeams with airborne golden dust motes and intense teal shadow tinting."
      dont: "DO NOT default to cinematic golden hour and Hollywood blockbuster orange/teal."
      do: "Explore overcast daylight, diffused Nordic shadows, editorial cool daylight, or honest flash photography."

    - id: "SLOP-PHOTO-003"
      name: "Creamy Gaussian Tilt-Shift Mush"
      tell: "Background obliterated into abstract creamy soup with fuzzy, inconsistent edge cutouts."
      dont: "DO NOT destroy background context with f/1.2 blur overkill to hide environment details."
      do: "Use f/8 to f/11 deep depth-of-field where architecture and workspace context remain crisp and tell a story."

    - id: "SLOP-PHOTO-005"
      name: "Catchlight Divergence & Polyhedral Pupils"
      tell: "Divergent light reflection shapes in left vs right eye; irregularly warped or frayed pupil outlines."
      dont: "DO NOT deploy portraits with discordant eye catchlights or non-circular pupil geometry."
      do: "Verify catchlight fidelity at 400% zoom: light source reflection must align across both corneas."

    - id: "SLOP-PHOTO-006"
      name: "Monolithic Tooth Bar (Piano Key Smile)"
      tell: "Teeth depicted as a single contiguous plastic bar lacking interdental spaces and natural anatomy."
      dont: "DO NOT tolerate gapless monolithic dental bars in business stock imagery."
      do: "Require authentic dental morphology with distinct crown widths, natural shadows, and individual spacing."

    - id: "SLOP-PHOTO-007"
      name: "Contact Shadow Deficit (Floating Object Syndrome)"
      tell: "Feet, furniture, or held objects lack dark ambient occlusion contact shadows, floating unanchored."
      dont: "DO NOT use images where subjects float without physical surface anchoring."
      do: "Insist on realistic ambient occlusion contact shadows directly under all load-bearing points."

  typography_and_layout:
    - id: "SLOP-TYPE-001"
      name: "Inter/Roboto Monoculture"
      tell: "Defaulting to neutral sans-serif everywhere with zero editorial pairing or stylistic tension."
      dont: "NEVER use default Inter for everything without deliberate pairing."
      do: "Pair high-personality display type (e.g. 'Cabinet Grotesk', 'Playfair', 'Space Grotesk') with utilitarian body."

    - id: "SLOP-TYPE-002"
      name: "Centered Multi-Line Body Paragraphs"
      tell: "Centering 4-line prose paragraphs, destroying the reader's left-eye scanning anchor."
      dont: "NEVER center-align body text paragraphs longer than 2 lines."
      do: "Always left-align multi-line text (align: left;). Center only single-line badges and heroic H1s."

    - id: "SLOP-TYPE-003"
      name: "Low-Contrast Ghost Text"
      tell: "Fließtext in #555555 on dark gray #1A1A1A, failing accessibility standards."
      dont: "DO NOT use body text with contrast ratio < 4.5:1."
      do: "Use minimum #94A3B8 (Slate 400) or #A1A1AA (Zinc 400) on dark surfaces."

    - id: "SLOP-TYPE-004"
      name: "Unspaced All-Caps Squeeze"
      tell: "UPPERCASE labels, badges, or headlines with normal/negative letter-spacing sticking together."
      dont: "NEVER emit all-caps text without positive letter-spacing."
      do: "Always add tracking: letter-spacing: 0.08em; to 0.15em; for uppercase tokens."

    - id: "SLOP-TYPE-005"
      name: "Deformed Counters & Asymmetric Serifs"
      tell: "Melted/closed counters (Punzen) in 'e'/'a'/'o'; serifs sharp on one side and clubbed/bulbous on the other."
      dont: "NEVER use synthetic logo text with corrupted letter counters or asymmetric serif mutations."
      do: "Rely exclusively on genuine digital typefaces with rigorously verified glyph vector contours."

    - id: "SLOP-TYPE-006"
      name: "Kerning Collapse & Baseline Drift"
      tell: "Erratic glyph spacing within a single word; letters drifting off the baseline or tilting off-axis."
      dont: "DO NOT accept chaotic glyph collisions or variable stem widths on symmetrical letters (M, W, H)."
      do: "Use mathematical typography engines and standard font kerning tables with strict baseline alignment."

    - id: "SLOP-TYPE-007"
      name: "Baked-Text Trap (Destroyed Type Layers)"
      tell: "Text baked irreversibly into flat pixels or broken path vectors, preventing native editing."
      dont: "NEVER export text as flattened pixels or uneditable vector soup in production PSDs/assets."
      do: "Retain native TOAD text nodes mapped to live Photoshop Type Layers (TySh) with synced fonts in 'fonts/'."

    - id: "SLOP-TYPE-008"
      name: "Floating Text Pill Syndrome (Top-Baseline Clinging)"
      tell: "Text inside compact pills, badges, or buttons sitting 2-4px too high due to uncompensated top-baseline font metrics."
      dont: "NEVER rely on raw bounding box centering without verifying glyph optical vertical alignment against container borders."
      do: "Apply optical Cap-Height Offset (+1.5px to +2.5px at 1x; +3px to +5px at 2x) or run pixel-scan verification so (topGap == botGap)."

    - id: "SLOP-DECK-002"
      name: "Megalithic Quote Monument"
      tell: "Giant 120pt quotation marks ('“') occupying 60% of canvas/slide area at 15% opacity to disguise text scarcity and cognitive emptiness."
      dont: "DO NOT inflate punctuation glyphs into giant background filler geometry."
      do: "Set quotes with disciplined editorial rag, clear source attribution, and confident negative space."

    - id: "SLOP-TYPE-011"
      name: "Leading Collision & Baseline Strangulation"
      tell: "Headlines with line-height < 1.08em where umlauts (Ä, Ö, Ü) and descenders (g, j, y) crash into each other."
      dont: "DO NOT squeeze display headlines into suffocating sub-1.10 leading."
      do: "Provide minimum 1.15em to 1.25em leading on display titles to allow accents and descenders to breathe."

    - id: "SLOP-TYPE-012"
      name: "Inconsistent Title/Sentence Case Schizophrenia"
      tell: "Navigation links or feature lists mixing Title Case and Sentence case randomly within the same container."
      dont: "DO NOT alternate capitalization styles across sibling UI elements."
      do: "Adopt a consistent casing rule (e.g. 100% Sentence case for modern SaaS) across all list items."

    - id: "SLOP-TYPE-013"
      name: "Orphan & Widow Baseline Stragglers"
      tell: "A single short word (<= 5 chars) stranded on its own on the final line of a paragraph."
      dont: "DO NOT leave isolated single words on paragraph baselines."
      do: "Enforce text-wrap: balance or insert non-breaking spaces before the final word."

    - id: "SLOP-TYPE-014"
      name: "Fractional Sub-Pixel Font Blur"
      tell: "Text placed on fractional coordinates (e.g. x: 142.37px) or fractional font sizes (15.4px) causing blurry rasterization."
      dont: "DO NOT position text nodes on non-integer subpixels."
      do: "Snap text coordinates to integer pixel boundaries (Math.round) for crisp rendering."

    - id: "SLOP-TYPE-015"
      name: "Hierarchy Gap Deficit (The Flat Typographic Wall)"
      tell: "H1 and body text differing by less than 1.35x in size with identical medium font weight."
      dont: "DO NOT build flat text hierarchies where titles fail to establish clear typographic dominance."
      do: "Follow modular typographic scales (min 1.5x - 2.5x step) and high-contrast weight pairing (Bold vs Regular)."

  frontend_dom_and_code:
    - id: "SLOP-CODE-001"
      name: "Tailwind Paradoxical Conflicts"
      tell: "Conflicting classes in the same tag (p-4 and px-6; block combined with flex)."
      dont: "DO NOT emit conflicting Tailwind utility overrides."
      do: "Clean up class lists and extract semantic sub-components."

    - id: "SLOP-CODE-002"
      name: "Div-Soup & Zero HTML5 Semantics"
      tell: "Hundreds of nested <div>/<span> elements with zero <main>, <header>, <nav>, or <section>."
      dont: "NEVER build an entire page layout out of raw <div> tags."
      do: "Use strict HTML5 semantics (<header>, <main>, <nav>, <section>, <article>, <footer>)."

    - id: "SLOP-CODE-003"
      name: "Fake-Buttons (div onclick)"
      tell: "Clickable elements rendered as <div onclick> or <a href='#'> instead of <button>."
      dont: "NEVER use <div> or <span> as clickable button replacements."
      do: "Always use native semantic <button> elements with full keyboard focusability."

    - id: "SLOP-CODE-004"
      name: "Inline-SVG Flooding"
      tell: "40- to 80-line raw SVG vector paths duplicated dozens of times directly in HTML body."
      dont: "DO NOT paste repetitive inline SVG code blocks across DOM templates."
      do: "Use unified icon systems (Lucide, Heroicons, Phosphor) or TOAD component symbols."

    - id: "SLOP-CODE-005"
      name: "Unicode-Emoji Cheap Substitution"
      tell: "Raw system emojis (🚀, ✨, ⚡, 🎯) used as tile icons, bullets, or dividers."
      dont: "NEVER use raw emojis as UI icons in business software."
      do: "Use calibrated vector icons with consistent 1.5px stroke weight."

    - id: "SLOP-CODE-006"
      name: "Trivial 'What-It-Does' Code Comments"
      tell: "Comments like '// Function to handle form submission' or '// Set active state to true'."
      dont: "DO NOT emit obvious, redundant code comments."
      do: "Comment only the architectural rationale, domain 'why', and complex edge-case math."

  interaction_and_runtime:
    - id: "SLOP-RUN-001"
      name: "Mock-State Illusion (Fake Backend)"
      tell: "Forms and search inputs show success modal but fire zero network requests in DevTools."
      dont: "DO NOT create purely local mocked state without real API error/loading handling."
      do: "Model full state machines: pending, network errors, validation, and real payloads."

    - id: "SLOP-RUN-002"
      name: "Static Array Filter Mocking"
      tell: "Search bars filtering 3 hardcoded dummy items; zero handling for empty results or pagination."
      dont: "DO NOT implement happy-path-only client array filters."
      do: "Implement realistic empty states, debounce handling, and pagination."

    - id: "SLOP-RUN-003"
      name: "Accessibility Outline Sabotage"
      tell: "focus-visible removed via 'outline: none'; dummy alt='hero image'; inputs without <label for>."
      dont: "NEVER remove keyboard focus outlines without a high-contrast accessible ring alternative."
      do: "Enforce WCAG 2.2 AA compliance, semantic labels, and keyboard accessibility."

    - id: "SLOP-RUN-004"
      name: "Responsive Mid-Breakpoint Collapse"
      tell: "Layouts breaking on tablets (768-1024px) or ultrawide (>1920px) with horizontal scrollbars."
      dont: "DO NOT code fixed pixel wrappers that assume only 390px or 1440px viewports."
      do: "Design fluid layouts with max-width boundaries and relational flex/stack math."

    - id: "SLOP-RUN-005"
      name: "Em-Dash Inflation (—)"
      tell: "Excessive em-dashes in titles ('Scale faster — with no effort — using smart AI')."
      dont: "DO NOT overuse rhetorical em-dashes (—) in German and English copy."
      do: "Use natural, grounded sentence structure with standard punctuation."

  assets_and_compliance:
    - id: "SLOP-ASSET-001"
      name: "Unsplash Parameter Signature & placehold.co"
      tell: "Raw URLs containing 'auto=format&fit=crop&w=800&q=80' or placehold.co in production."
      dont: "NEVER leave external stock photo parameters or placeholder domains in final code."
      do: "Use local WebP/AVIF assets or native TOAD vectors."

    - id: "SLOP-ASSET-002"
      name: "Google Fonts Remote Streaming (GDPR Violation)"
      tell: "Streaming fonts from fonts.googleapis.com instead of local hosting."
      dont: "DO NOT stream fonts directly from Google servers in EU jurisdictions."
      do: "Self-host all font files locally via @font directives."

    - id: "SLOP-ASSET-003"
      name: "Dead OpenGraph Previews"
      tell: "og:image pointing to non-existent /og.png resulting in 404s."
      dont: "DO NOT declare ghost OG images that fail to resolve."
      do: "Always generate and test actual 1200x630px social cards."

    - id: "SLOP-ASSET-004"
      name: "Dummy Remnants (+1 555 / example.com)"
      tell: "Footer displaying contact@company.com, +1 (555) 0123, or hardcoded outdated copyright year."
      dont: "NEVER ship templates containing unlocalized dummy contact information."
      do: "Use realistic localized contact formats and dynamic dates."

    - id: "SLOP-ASSET-005"
      name: "Phantom Executives & Fake Testimonials"
      tell: "Praising quotes from 'VP of Tech at CloudCore' with nonexistent LinkedIn profiles."
      dont: "DO NOT hallucinate fictional executive endorsements."
      do: "Use verifiable case studies or grounded user problem statements."

    - id: "SLOP-LAW-001"
      name: "EU AI Act Art. 50 Disclosure Requirement (August 2026)"
      tell: "Commercial publication of photorealistic AI media without machine/human-readable labels."
      dont: "DO NOT deploy AI-generated photorealistic imagery in the EU without proper disclosure."
      do: "Comply with EU AI Act Art. 50 transparency requirements (labels and C2PA manifests)."

  icons_and_textures:
    - id: "SLOP-ICON-001"
      name: "Heterogeneous Icon Sets & Stroke Inconsistency"
      tell: "Stroke weights jump erratically between 1.0px, 2.0px, and 3.5px within the same icon family."
      dont: "DO NOT mix different stroke weights or line styles across icons in the same interface."
      do: "Standardize stroke width (e.g. 1.5px or 2.0px on 24x24 grid) across the entire icon family."

    - id: "SLOP-ICON-002"
      name: "Projection Fractures & Mixed Corner Joins"
      tell: "Orthogonal 2D icons placed alongside isometric 2.5D icons; miter, round, and bevel joins mixed."
      dont: "DO NOT combine 2D flat icons with 3D/isometric icons or alternate join styles."
      do: "Maintain uniform projection (100% 2D frontal or 100% isometric) and consistent corner rounding."

    - id: "SLOP-ICON-003"
      name: "Wandering Light Origins in Icon Series"
      tell: "Shadows and highlights cast in random directions across icons in the same navigation bar."
      dont: "DO NOT design shaded icon series without a global synchronized light angle."
      do: "Establish a single virtual light source (e.g. 45° top-left) for all rendered icon highlights."

    - id: "SLOP-TEX-001"
      name: "Baked Photoshop Checkerboard Artifact"
      tell: "Opaque image contains gray-and-white transparency checkerboard painted directly into color pixels."
      dont: "NEVER output images with fake transparency checkerboards burned into bitmap pixels."
      do: "Ensure real PNG/WebP alpha channels that cleanly reveal whatever background sits beneath."

    - id: "SLOP-TEX-002"
      name: "Fringing & Edge Halo Defect (Matting Contamination)"
      tell: "Dirty gray/white edge halos around cutouts caused by poor antialiasing against original canvas."
      dont: "DO NOT use masked assets with dirty halo fringing around their contours."
      do: "Use clean alpha clipping masks or native mathematical vector hulls with zero background bleed."

    - id: "SLOP-TEX-003"
      name: "Tiling Seams in Seamless Patterns"
      tell: "Pattern repeats show visible edge seams, mismatching lines, or brightness banding in a 3x3 grid."
      dont: "DO NOT declare textures seamless without verifying periodic boundary matching."
      do: "Pass the 3x3 Tiling Test: ensure pixel-perfect continuity across horizontal and vertical seams."

    - id: "SLOP-TEX-004"
      name: "Sub-Perceptual Color Noise on Flat Fills"
      tell: "Surfaces appearing flat (#FFF / #000) reveal thousands of micro-noise artifacts under contrast boost."
      dont: "DO NOT import rasterized flat fills with residual diffusion noise."
      do: "Use pure mathematical TOAD hex color tokens (fill: #FFFFFF;) for vector backgrounds."

  print_and_editorial:
    - id: "SLOP-PRINT-001"
      name: "Swiss-Slop & Grid Cosplay"
      tell: "Arbitrary registration marks (+, ⌖) placed >15mm inside live layout; fake giant numerals ('01', '08') and pseudo-Swiss labels ('Rasterlehre') used as visual filler."
      dont: "DO NOT scatter fake technical registration marks and meaningless numerals into live art."
      do: "Build honest mathematical modular grids; place technical marks exclusively in the slug/bleed zone."

    - id: "SLOP-PRINT-002"
      name: "Unscannable Barcode & QR Decals"
      tell: "Barcodes and QR codes stuck onto posters as purely decorative aesthetic decals with broken quiet zones and rounded corners."
      dont: "DO NOT paste invalid, unscannable barcodes as decorative stickers."
      do: "Generate ISO-compliant, high-contrast black vector barcodes on white quiet zones with valid checksums."

    - id: "SLOP-PRINT-003"
      name: "Telemetrie-Stamping & Null-Island GPS"
      tell: "Monospace GPS coordinates ('LAT 35°41'N...') and fake camera EXIF strings stamped onto margins of posters and flyers."
      dont: "DO NOT use random GPS coordinates and fake telemetry strings to fill layout margins."
      do: "Document authentic production metadata (colophon, paper weight, font list, ISO profile) or leave confident whitespace."

    - id: "SLOP-PRINT-004"
      name: "Analog Laundering (Uniform Noise Washing)"
      tell: "Homogeneous digital Perlin noise applied uniformly across darks and lights to disguise synthetic AI smoothness as 'risograph'."
      dont: "DO NOT use flat uniform noise washes as a crutch for authentic print texture."
      do: "Use real paper fiber textures with luminance-dependent density or authentic stochastic screening."

    - id: "SLOP-PRINT-005"
      name: "Mockup Crease Displacement Deficit"
      tell: "4-fold or 8-fold digital paper creases overlaid onto artwork while vector typography runs with 0° linear perfection across creases without displacement."
      dont: "DO NOT apply fake paper crease overlays without physical geometric distortion."
      do: "Present digital artwork flat, or model physically accurate vector distortion across genuine fold lines."

    - id: "SLOP-PRINT-006"
      name: "Nihon-Fetischismus & Kanji-Greebling"
      tell: "Random Japanese Kanji/Katakana characters placed on Western designs; vertical text with horizontal Chōonpu ('ー') rotation bug."
      dont: "DO NOT drop arbitrary Asian glyphs into designs as cheap cyberpunk aesthetic seasoning."
      do: "Design typography in the native language of the message; engage native typographers for genuine multilingual work."

    - id: "SLOP-PRINT-007"
      name: "Fake Paper Fold Texture without Displacement"
      tell: "Digital paper crease texture overlay while underlying vector text runs perfectly straight with 0° displacement."
      dont: "DO NOT apply flat digital paper crease textures over live vector graphics."
      do: "Present print artwork flat as authentic 2D vector art, or model realistic physical geometric fold displacement."

    - id: "SLOP-PRINT-008"
      name: "Pseudo-Swiss Crop Marks in Live Copy Area"
      tell: "Printer registration marks (⌖, ⊕, crop marks) placed >15mm inside the live content canvas."
      dont: "DO NOT scatter technical printer marks inside live layout areas."
      do: "Confine printer registration marks strictly to the external bleed and slug zones."

    - id: "SLOP-PRINT-009"
      name: "Analog Laundering (Uniform Noise Washing)"
      tell: "Homogeneous digital noise applied uniformly across darks and lights to fake risograph or screen-print texture."
      dont: "DO NOT wash clean vector shapes in uniform digital noise filters."
      do: "Use real scanned paper fiber substrates with luminance-proportional ink absorption."

    - id: "SLOP-PRINT-010"
      name: "Gutter Strangulation & Spine Creep Deficit"
      tell: "Multi-page spread where text crosses or pinches into the central spine without inner gutter allowance."
      dont: "DO NOT place copy across the inner binding gutter."
      do: "Provide generous inner gutter margin (min 24–30mm) and compensate for paper bulk creep."

  dataviz_and_dashboards:
    - id: "SLOP-DASH-001"
      name: "Hero Fake-Dashboard Mirage"
      tell: "Decorative analytics dashboard in hero sections featuring a smooth, monotonically rising curve with violet gradient fill, but lacking axes, units, or scales."
      dont: "DO NOT place decorative fake charts with arbitrary upward curves as hero eye-candy."
      do: "Display authentic product interfaces with real data domains, realistic metrics, and honest axes."

    - id: "SLOP-DASH-002"
      name: "Monotonic Utopian Curve (Zero-Variance Trendline)"
      tell: "Hero revenue curve with monotonic climb (dy/dx >= 0) and zero variance, dips, or seasonal realities."
      dont: "DO NOT display unrealistically perfect smooth growth lines."
      do: "Model authentic time-series metrics with natural seasonal variance and transparent data points."

    - id: "SLOP-DASH-003"
      name: "Ghost Axes & Disembodied Datapoints"
      tell: "Chart components with visual curve paths but zero axes, timestamps, units ($/%) or scale labels."
      dont: "DO NOT emit uncalibrated, ungrounded chart curves without numbers."
      do: "Provide clear calibrated X and Y axes, zero baseline anchors, and explicit domain units."

    - id: "SLOP-DASH-004"
      name: "Rainbow Spectral Doughnut Catastrophe"
      tell: "Donut chart sliced into >5 hairline rainbow segments without center KPI summary."
      dont: "DO NOT overfragment pie or donut charts into unreadable rainbow slivers."
      do: "Limit donut slices to max 4-5 categories (aggregate rest as 'Other') with prominent center KPI value."

    - id: "SLOP-DASH-005"
      name: "Chromatic Semantic Polarity Inversion"
      tell: "Negative business metrics (-18% churn, error rate) colored in success green, or growth in danger red."
      dont: "NEVER invert standard semantic color polarity in metrics."
      do: "Reserve green strictly for positive growth and operational health; red for errors, latency, and losses."

    - id: "SLOP-VIZ-001"
      name: "Truncated Axis Distortion (The Fox News Bar)"
      tell: "Bar or column charts starting at Y_min > 0, exaggerating trivial 0.5% differences into 10x visual spikes (Tufte Lie Factor >> 1.0)."
      dont: "NEVER truncate the zero baseline on bar or column charts."
      do: "Always anchor bar charts at Y=0; use line charts or explicit delta charts for small fluctuations."

    - id: "SLOP-VIZ-002"
      name: "Technicolor Confusion (Rainbow for Binary Data)"
      tell: "6 high-saturation spectral rainbow hues used for simple binary (yes/no) or sequential ordered data."
      dont: "DO NOT use rainbow palettes for ordered or sequential data dimensions."
      do: "Use monochromatic lightness ramps (light blue to deep navy) or perceptually uniform scales (Viridis/Cividis)."

    - id: "SLOP-VIZ-003"
      name: "Eyecandy Hula-Hoop Donut"
      tell: "Ultra-thin donut ring with 10+ hairline segments, zero percentage labels in center, and unreadable legend."
      dont: "DO NOT use thin unlabeled multi-slice donut charts as decorative filler."
      do: "Cap donut charts at max 4-5 aggregated categories with prominent center KPI value."

    - id: "SLOP-VIZ-004"
      name: "Isometrischer 3D-Balken- & Torten-Betrug"
      tell: "3D perspective distortion causing front slices to appear 40%+ larger in visual area than identical or larger rear slices."
      dont: "NEVER use pseudo-3D extrusion on 2D charts and data visualizations."
      do: "Use pure orthogonal 2D charts where screen area is strictly proportional to numerical value."

    - id: "SLOP-DECK-001"
      name: "Die 4-Schritte-Chevron-Pfeil-Schablone"
      tell: "Every workflow, roadmap, and lifecycle forced into 4 identical connected chevron arrows ('Discover -> Define -> Develop -> Deliver')."
      dont: "DO NOT force complex processes into rigid 4-chevron conveyor belts."
      do: "Model authentic process topologies with iterative loops, parallel streams, and realistic time weighting."

    - id: "SLOP-DECK-004"
      name: "Clipart-Squircle Feature Matrix"
      tell: "2x3 grid of pastel rounded squares containing disconnected stock icons (Rocket, Lock, Lightbulb, Cog)."
      dont: "DO NOT hide real capabilities behind generic icon-in-squircle boxes."
      do: "Show concrete product artifacts: code blocks, data tables, live previews, and verifiable metrics."

    - id: "SLOP-DECK-005"
      name: "Pre-Seed Global Dominance Arcs"
      tell: "Gray dot-matrix world map with glowing curved SVG bezier arcs between London, SF, and Tokyo for pre-customer startups."
      dont: "DO NOT simulate global enterprise presence with generic world map flight arcs."
      do: "Show actual server infrastructure regions or real customer distributions with verified data."

forensic_audit_matrix:
  ko_criteria_immediate_rejection:
    - "Dense node clustering: 40-200+ chaotic points per curve in vector logos (Ctrl+Y wireframe check)."
    - "Deformed letter counters (punzen) or asymmetric mutated serifs in brand typography."
    - "Snapping interactive states without transition easing or dead '#' navigation links."
    - "Melting vector outlines that dissolve midway into background shading."
    - "Heterogeneous stroke weights (1px mixed with 3.5px) within an icon set."
    - "Baked Photoshop transparency checkerboard pattern rendered into opaque image pixels."
    - "Visible seams or brightness steps during 3x3 tiling of seamless textures."
    - "Catchlight divergence or polyhedral/frayed pupils in portrait photography."

  heavy_suspicion_requires_audit:
    - "Functional collapse: logo illegible at 16x16px favicon scale or destroyed in 1-bit monochrome."
    - "Impossible 3D geometry: self-intersecting ribbons with illogical light shading."
    - "Purposeless 3-4px left-edge accent stripe on cards combined with cookie-cutter Tailwind defaults."
    - "Editorial faker italic serif word break inside an otherwise clean sans-serif headline."
    - "Uncontrolled spacing values breaking an established 8pt token grid."
    - "Visual tangents where foreground contours share exact 2D coordinates with background horizons."
    - "Non-functional mechanical greebling with cables, gears, or pistons that cannot physically work."


