# TOAD DSL — Pre-Flight Chain-of-Thought Checklist
# Version: 3.0
# Target: Gemini 3.1 Pro / 3.5 Pro / 3.8 Flash

verification_steps:
  0_multi_dna_inspiration:
    check: "Are at least 3 Personas (Mod 09) and at least 3 Corporate Systems (Mod 10) declared in the inspiration header (more encouraged, no upper limit)?"
    rule: "Design tasks MUST output the inspiration matrix comment block declaring >=3 personas and >=3 corporate systems (asymmetric counts welcome)."
    action_if_invalid: "Select min 3 personas from the_seed/09 and min 3 corporate systems from the_seed/10 (more if fitting) and declare inherited traits."

  1_syntax_tokens:
    check: "Are all variables declared with '>' and '=' and end with ';'?"
    pattern: "^>[a-zA-Z0-9_]+\\s*=\\s*[^;]+;$"
    action_if_invalid: "Ensure prefix is '>', remove any '$', change ':' to '=', and add semicolon ';'"

  2_font_stacks:
    check: "Are all font fallback chains wrapped in a single quoted string?"
    invalid_pattern: "\"[^\"]+\",\\s*[a-zA-Z-]+"
    valid_pattern: "\"[^\"]+,\\s*[^\"]+\""
    action_if_invalid: "Merge into single string literal: \">font = \\\"Inter, sans-serif\\\";\""

  3_statement_termination:
    check: "Does every property, @import, @font, and slot; end with ';'?"
    action_if_invalid: "Append ';' before closing brace or newline"

  4_text_wrapping:
    check: "Does every multiline text node specify an explicit wrapping width?"
    rule: "Text with length > 40 chars MUST define 'width:' or 'size:'"
    action_if_invalid: "Add 'width: 480px;' or 'size: 480px hug;'"

  5_offset_spacing:
    check: "Is every 'offset' keyword followed by whitespace rather than a colon?"
    invalid_token: "offset:"
    valid_token: "offset "
    action_if_invalid: "Remove the colon after offset"

  6_badge_margins:
    check: "Is badge/pill container width >= 1.20x raw text width?"
    rule: "Text width ~80px requires container width >= 100px"
    action_if_invalid: "Increase container width or padding to prevent SVG clipping"

  7_vibrant_alphas:
    check: "Are neon/glow radial gradient center stop opacities >= 0.25?"
    rule: "alpha(color, < 0.25) appears washed out or gray in SVG sRGB interpolation"
    action_if_invalid: "Boost center stop opacity to 0.30 - 0.45"

  8_fill_vs_color:
    check: "Do shapes use 'fill:' and text elements use 'color:'?"
    action_if_invalid: "Change fill: to color: on text nodes"

  9_no_css_hallucinations:
    check: "Are CSS display, flexbox, div, span, and rgba completely absent?"
    action_if_invalid: "Replace with stack, rect, and alpha()"

  10_anti_ai_slop_check:
    check: "Did I eliminate generic AI-slop tropes (purple haze, bento overkill, clutter overload, noodle arms, centered 4-line prose, floating debris)?"
    rule: "Designs MUST adhere to rules/anti_ai_slop_heuristics.xml (LESS IS MORE: reserve 40-60% calm whitespace)."
    action_if_invalid: "Remove cluttered badges/cards; replace purple haze with structured surfaces; left-align body text; delete floating debris."

  11_fonts_directory_sync:
    check: "Are all required font binaries (.ttf/.otf) verified to exist in the central repository 'c:/toad-designs/fonts/' (expanding it if new fonts are needed)?"
    rule: "Designs MUST NOT duplicate font folders locally per project. All fonts are centralized in 'c:/toad-designs/fonts/'. When a design uses a new font, expand the central repository."
    action_if_invalid: "Add the required font file (.ttf/.otf) to 'c:/toad-designs/fonts/' and ensure @font / font-family references are aligned."

  12_optical_text_centering:
    check: "Are texts in compact pills, badges, and buttons optically centered using cap-height offset (+1.5px to +2.5px @1x) or trim: cap / verticalAlign: middle?"
    rule: "Top-baseline text rendering causes descenderless uppercase strings to appear 2-3px too high. Align glyph visual center to container midline and adjacent icon center."
    action_if_invalid: "Apply vertical-align: middle; or trim: cap; or add +1.5px to +2.5px (+3-5px @2x) optical y-offset."

