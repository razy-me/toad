<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <filter id="filter_1" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <radialGradient id="rad_grad_1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" color-interpolation="sRGB">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.145" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.063" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lin_grad_2" x1="15%" y1="15%" x2="85%" y2="85%" color-interpolation="sRGB">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="filter_2" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#090d16" />
 <rect x="800" y="-100" width="700" height="500" fill="url(#rad_grad_1)" id="ambientGlow" filter="url(#filter_1)" />
