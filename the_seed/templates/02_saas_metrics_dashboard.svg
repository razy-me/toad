 <rect x="1078" y="120" width="322" height="140" rx="14" ry="14" fill="#111827" stroke="#33415550" stroke-width="1" id="kpi4" />
  </g>
  <g id="mainBento">
 <rect x="40" y="284" width="890" height="580" rx="16" ry="16" fill="#111827" stroke="#33415550" stroke-width="1" id="chartCard" />
