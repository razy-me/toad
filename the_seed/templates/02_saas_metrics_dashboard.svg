  <text x="44" y="12" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800" font-style="normal" text-anchor="start" letter-spacing="1" xml:space="preserve" fill="#f8fafc" id="brandName">NEXUS // CORE ANALYTICS</text>
 <rect x="0" y="0" width="160" height="36" rx="9999" ry="9999" fill="#10b98115" stroke="#10b98140" stroke-width="1" id="statusPill" />
 <circle cx="4" cy="4" r="4" fill="#10b981" id="statusDot" filter="url(#filter_2)" />
  <text x="16" y="9" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0.5" xml:space="preserve" fill="#34d399" id="statusText">ALL SYSTEMS LIVE</text>
