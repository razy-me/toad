      <text x="474" y="268" font-family="sans-serif" font-size="22" font-weight="900" font-style="normal" text-anchor="start" fill="#07090e" id="promptGlyph" dominant-baseline="hanging">&gt;_</text>
 <rect x="455.5" y="299" width="54" height="6" rx="3" ry="3" fill="#07090e" id="mouthBeam" />
